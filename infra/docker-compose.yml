services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: neo
      POSTGRES_DB: neo
    ports: ["5433:5432"]
    volumes: ["neo_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neo
      MINIO_ROOT_PASSWORD: neominio
    ports: ["9000:9000", "9001:9001"]
    volumes: ["neo_minio:/data"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["neo_ollama:/root/.ollama"]
    # GPU acceleration (NVIDIA). Falls back to CPU automatically if no GPU/driver.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  extractor:
    build:
      context: ..
      dockerfile: services/extractor/Dockerfile
    depends_on: [ollama]
    environment:
      OLLAMA_URL: http://ollama:11434
      # Quality-first default (7B); a lightweight 3B model is raced in
      # automatically behind it for sellers on slow/CPU-only hardware — see
      # services/extractor/src/server.ts. Override either via .env if needed.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:7b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-qwen2.5vl:3b}
      PORT: 8000
    ports: ["8000:8000"]

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      extractor:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://neo:neo@postgres:5432/neo
      REDIS_URL: redis://redis:6379
      # Reach the extractor by its compose service name — inside the backend
      # container "localhost" is the container itself, not the extractor.
      EXTRACTOR_URL: http://extractor:8000
      PORT: 3000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: neo
      MINIO_SECRET_KEY: neominio
      MINIO_BUCKET: neo-products
      MINIO_PUBLIC_URL: http://localhost:9000
    ports: ["3000:3000"]

volumes:
  neo_pg:
  neo_minio:
  neo_ollama:
