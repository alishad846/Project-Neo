<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-route <title> and <meta name="description"> are rendered by <Seo>
         (React 19 hoists them into <head>). They are intentionally NOT set here:
         a static copy would produce duplicate title/description tags alongside
         the React-rendered ones. Every route — including "/" — renders <Seo>, so
         there is always exactly one of each once the app mounts. -->
    <meta name="theme-color" content="#fff0f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Bangers&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
