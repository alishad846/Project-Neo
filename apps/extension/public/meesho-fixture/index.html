<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meesho Supplier Panel (fixture)</title>
    <style>
      body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
      label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; }
      input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
      #status { margin-top: 16px; padding: 8px; border-radius: 4px; display: none; }
      #status.filled { display: block; background: #e6ffed; color: #036b26; }
    </style>
  </head>
  <body>
    <h2>Add a new product (fixture)</h2>
    <p style="color:#666; font-size:12px;">
      This local page stands in for the real Meesho Supplier Panel so Neo's
      publish flow can be demoed safely, without touching a live seller account.
    </p>
    <label for="title">Product title</label>
    <input id="title" />
    <label for="description">Description</label>
    <textarea id="description" rows="4"></textarea>
    <label for="hsnCode">HSN code</label>
    <input id="hsnCode" />
    <label for="sellingPrice">Selling price</label>
    <input id="sellingPrice" />
    <div id="status">Filled by Project Neo ✓</div>
    <script>
      chrome.runtime.onMessage.addListener((message) => {
        if (message?.type !== "neo:fill-meesho-fixture") return;
        var fields = message.fields || {};
        document.getElementById("title").value = fields.title || "";
        document.getElementById("description").value = fields.description || "";
        document.getElementById("hsnCode").value = fields.hsnCode || "";
        document.getElementById("sellingPrice").value = fields.sellingPrice || "";
        document.getElementById("status").classList.add("filled");
      });
    </script>
  </body>
</html>
