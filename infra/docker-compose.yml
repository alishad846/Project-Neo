services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: neo
      POSTGRES_DB: neo
    ports: ["5432:5432"]
    volumes: ["neo_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neo
      MINIO_ROOT_PASSWORD: neominio
    ports: ["9000:9000", "9001:9001"]
    volumes: ["neo_minio:/data"]

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://neo:neo@postgres:5432/neo
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports: ["3000:3000"]

volumes:
  neo_pg:
  neo_minio:
